<!doctype html>
<html lang="ms" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Buku — hook sahaja (teks, tanpa voice over)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=TikTok+Sans:wght@500;700;800&family=Noto+Color+Emoji&display=block" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root { --ground: #0b0b0b; --ink: #ffffff;
        --font-tiktok: "TikTok Sans", "Noto Color Emoji", "Helvetica Neue", Arial, sans-serif; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--ground); }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: var(--font-tiktok); color: var(--ink); }
      #cam { position: absolute; inset: 0; transform-origin: 50% 55%; scale: 1.1; }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 50%; }
      #shade { position: absolute; inset: 0; pointer-events: none; z-index: 5;
        background: linear-gradient(180deg, rgba(0,0,0,.30) 0%, rgba(0,0,0,.42) 30%, rgba(0,0,0,.46) 52%, rgba(0,0,0,.30) 75%, rgba(0,0,0,.45) 100%); }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 6; pointer-events: none; }
      .txt { position: absolute; left: 70px; right: 70px; top: 0; bottom: 0; z-index: 15; display: flex; flex-direction: column;
        align-items: center; justify-content: center; text-align: center; padding-bottom: 170px; text-shadow: 0 0 3px rgba(0,0,0,.95), 2px 2px 0 rgba(0,0,0,.55), -2px -2px 0 rgba(0,0,0,.55), 2px -2px 0 rgba(0,0,0,.55), -2px 2px 0 rgba(0,0,0,.55), 0 4px 18px rgba(0,0,0,.55); }
      .txt .big { font-weight: 700; font-size: 84px; line-height: 1.12; letter-spacing: -0.01em; text-wrap: balance; }
      .txt .sub { font-weight: 500; font-size: 50px; line-height: 1.2; margin-top: 20px; }
      #points { gap: 40px; }
      .pt-t { font-weight: 700; font-size: 66px; line-height: 1.1; letter-spacing: -0.01em; }
      .pt-s { font-weight: 500; font-size: 42px; line-height: 1.2; margin-top: 8px; color: rgba(255,255,255,.92); }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10.00" data-width="1080" data-height="1920">
      <div id="cam" style="scale: 1">
        <video id="shot0" class="clip shot" src="assets/footage/clip1.mp4" data-start="0.00" data-duration="2.50" data-media-start="2.00" data-track-index="0" muted playsinline preload="auto"></video>
        <video id="shot1" class="clip shot" src="assets/footage/clip2.mp4" data-start="2.50" data-duration="2.00" data-media-start="2.20" data-track-index="0" muted playsinline preload="auto"></video>
        <video id="shot2" class="clip shot" src="assets/footage/clip3.mp4" data-start="4.50" data-duration="2.00" data-media-start="35.80" data-track-index="0" muted playsinline preload="auto"></video>
        <video id="shot3" class="clip shot" src="assets/footage/clip2.mp4" data-start="6.50" data-duration="1.80" data-media-start="26.00" data-track-index="0" muted playsinline preload="auto"></video>
        <video id="shot4" class="clip shot" src="assets/footage/clip1.mp4" data-start="8.30" data-duration="1.70" data-media-start="16.05" data-track-index="0" muted playsinline preload="auto"></video>
      </div>
      <div id="shade"></div>
      <div id="flash"></div>
      <div id="hook" class="clip txt" data-start="0" data-duration="10.00" data-track-index="1"><div class="big">Kalau nak start baca buku, mula dengan 2 buku ni 📚</div></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.set("#cam", {rotation: 0, x: 0}, 0);
      tl.fromTo("#hook .big", {scale: 0.55, opacity: 0}, {scale: 1, opacity: 1, duration: 0.32, ease: "back.out(2.4)"}, 0.05);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
